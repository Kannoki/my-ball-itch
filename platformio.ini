; PlatformIO Project Configuration File
; Project: Robot do line 8 sensor + 4 dong co (L298N) + 3 Servo
; 3 build environments cho 3 combo phan cung:
;   - s3-ir          : ESP32-S3 DevKitC-1 + Cam bien IR 8 mat
;   - esp32-ir       : ESP32 38-pin       + Cam bien IR 8 mat
;   - esp32-photores : ESP32 38-pin       + Cam bien Quang tro 8 mat

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    madhephaestus/ESP32Servo @ ^3.0.6

; 1. Combo ESP32-S3 + IR 8 mat
[env:s3-ir]
board = esp32-s3-devkitc-1
build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; 2. Combo ESP32 38-pin + IR 8 mat
[env:esp32-ir]
board = esp32dev
build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D BOARD_ESP32_38PIN=1

; 3. Combo ESP32 38-pin + Quang tro (Photoresistor) 8 mat
[env:esp32-photores]
board = esp32dev
build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D BOARD_ESP32_38PIN=1
    -D SENSOR_PHOTORESISTOR=1
