; PlatformIO Project Configuration File
; Project: Robot do line + 4 dong co (L298N) + 3 Servo
; 4 build environments cho 4 combo phan cung:
;   - esp32-ir            : (MAC DINH) ESP32 38-pin + Cam bien IR 8 mat
;   - s3-ir               : ESP32-S3 DevKitC-1       + Cam bien IR 8 mat
;   - esp32-photores      : ESP32 38-pin             + Cam bien Quang tro 8 mat
;   - esp32-tcrt5000-2d41 : ESP32 38-pin             + Cam bien TCRT5000 2D4.1 (5 mat)

[platformio]
default_envs = esp32-ir

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; 1. Combo ESP32-S3 + IR 8 mat
[env:s3-ir]
board = esp32-s3-devkitc-1
build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; 2. Combo ESP32 38-pin + IR 8 mat
[env:esp32-ir]
board = esp32dev
build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D BOARD_ESP32_38PIN=1

; 3. Combo ESP32 38-pin + Quang tro (Photoresistor) 8 mat
[env:esp32-photores]
board = esp32dev
build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D BOARD_ESP32_38PIN=1
    -D SENSOR_PHOTORESISTOR=1

; 4. Combo ESP32 38-pin + TCRT5000 2D4.1 (5 mat)
[env:esp32-tcrt5000-2d41]
board = esp32dev
build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D BOARD_ESP32_38PIN=1
    -D SENSOR_TCRT5000_5CH=1
