; PlatformIO Project Configuration File for ESP32-S3 WROOM-1
; Project: Robot do line 8 sensor + 4 dong co (L298N) + 3 Servo

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Serial Monitor & Upload configs
monitor_speed = 115200
upload_speed = 921600

; USB CDC on Boot for ESP32-S3 USB native / JTAG port
build_flags = 
    -D CORE_DEBUG_LEVEL=3
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; Thu vien dieu khien Servo ho tro ESP32-S3
lib_deps =
    madhephaestus/ESP32Servo @ ^3.0.6
